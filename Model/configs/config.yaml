# configs/config.yaml

data:
  periods: ['5min', '15min', '1h', '1d', '1w']
  features:
    - open
    - high
    - low
    - close
    - volume
  train_ratio: 0.8
  sequence_length: 100
  batch_size: 32

model:
  input_dim: 29
  conv_filters: [64, 128, 256]
  lstm_units: [128, 64]
  dropout_rate: 0.3
  attention_heads: 8
  periodic_encoding_dim: 32

training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.001
  early_stopping_patience: 10
  optimizer: 'adam'
  loss_weights:
    price: 1.0
    trend: 1.0
    signal: 1.0

testing:
  batch_size: 32
  metrics:
    - 'accuracy'
    - 'precision'
    - 'recall'
    - 'f1'
  trading_metrics:
    - 'total_return'
    - 'sharpe_ratio'
    - 'max_drawdown'
    - 'win_rate'

evaluation:
  price_threshold: 0.002
  trend_threshold: 0.6
  signal_threshold: 0.7
  risk_free_rate: 0.02
  transaction_cost: 0.0003